name: POC CI/CD Pipeline
on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'poc'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Check if job should run
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.runBuildPush == 'true'
        run: echo "Proceeding with build and push..."

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests and Generate Code Coverage
        run: |
          npm run test -- --coverage
          npm install -g coveralls
          coveralls < coverage/lcov.info || true

      - name: Upload Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/lcov.info

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and Push Docker Image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/nodejs-app:${{ github.sha }}

  deploy:
    name: Deploy with Helm on Azure VM
    runs-on: [self-hosted, azure-vm]
    needs: build-and-push
    steps:
      - name: Check if job should run
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.runDeploy == 'true'
        run: echo "Proceeding with deployment..."

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Deploy using Helm
        run: |
          helm upgrade --install nodejs-app ./helm-chart \
            --namespace default \
            --set image.repository=${{ secrets.AZURE_ACR_LOGIN_SERVER }}/nodejs-app \
            --set image.tag=${{ github.sha }}
